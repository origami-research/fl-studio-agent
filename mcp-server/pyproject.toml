[project]
name = "fl-studio-mcp"
version = "0.1.0"
description = "MCP server for controlling FL Studio's piano roll"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "python-rtmidi>=1.5.0",
    "watchdog>=6.0.0",
    "numpy>=2.0.0",
    "flpkit @ git+https://github.com/clarkipeng/flpkit@v0.7.1",
]

[project.scripts]
fl-mcp = "fl_mcp.server:main"
fl-mcp-install = "fl_mcp.fl.install:main"

[tool.hatch.metadata]
# flpkit is our own extracted library, consumed straight from its repo
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "pyflp>=2.0", "python-rtmidi>=1.5"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Enforce the hygiene the code-quality proposal (docs/19) is built on. TRY003
# (vanilla raise messages) and PLC0415 (in-function imports) are baselined here
# and retired in proposal phases 2-3 (they need package unification first).
select = ["E", "F", "I", "BLE", "TRY", "SIM", "PTH", "TID", "RUF"]
ignore = ["TRY003", "PLC0415", "E501"]  # E402 retired: fl/ quarantine fixed the cross-tree boundary (#80)

[tool.ruff.lint.per-file-ignores]
# Tests may catch broadly / suppress deliberately. RUF059: unpacking a fixture
# tuple (`session, bridge, control = wired`) and using a subset is idiomatic.
"tests/**" = ["BLE", "TRY", "SIM105", "RUF059"]
