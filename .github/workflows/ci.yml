name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Two editable installs: the server package, and the repo-root package
      # that provides `harness` (replaces sys.path surgery).
      - run: uv sync --locked
      - run: uv pip install --python .venv/bin/python -e .. ruff
      # Lint gate: the code-taste rules in AGENTS.md / docs/19 are enforced here,
      # so a regression fails the PR instead of accumulating. Lint the whole tree
      # (src + tests) - test files are code too, and gating only src let lint rot
      # accumulate there unseen.
      - run: .venv/bin/ruff check ..
      # The fake-FL suite runs anywhere; live e2e (FL_E2E) is local/nightly only.
      - run: .venv/bin/python -m pytest -q --ignore=tests/e2e
  # The macOS boundary (docs/38): real cells and shell commands under Seatbelt,
  # on a macOS runner. These tests start sandbox-exec, kernels and network
  # calls, so they run only where FLMCP_SANDBOX_TESTS=1 asks for them; a run
  # that skips any of them fails, so a silent skip cannot pass for evidence.
  macos-sandbox:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv pip install --python .venv/bin/python -e ..
      - name: Seatbelt tests, none skipped
        env:
          FLMCP_SANDBOX_TESTS: '1'
          FLMCP_NETWORK_TESTS: '1'
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -v -rs tests/test_kernel_seatbelt.py | tee seatbelt.log
          ! grep -E '[0-9]+ skipped' seatbelt.log
      - name: A client over stdio sees confined=true and refused writes
        run: uv run --no-project --python 3.12 --with mcp python ../.github/scripts/macos_smoke.py .venv/bin/fl-mcp --workspace-only
  # The Windows boundary (docs/38): real run kernels in an AppContainer, on a Windows
  # runner set up like a box (the metadata firewall rule from the box contract). Like
  # macos-sandbox, these run only where FLMCP_SANDBOX_TESTS=1 asks, and a skip fails the job.
  windows-sandbox:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # python-rtmidi ships no cp313 Windows wheel, as on the box (scripts/build-wheel.sh).
      # Not editable: the AppContainer reads the venv, never the checkout an editable
      # install would point it at, so the kernel imports fl_mcp the way a user's does.
      - run: uv sync --locked --python 3.12 --no-editable
      - run: uv pip install --python .venv/Scripts/python.exe -e ..
      - name: Block the metadata address for the kernel's AppContainer (box contract step 3)
        shell: pwsh
        run: |
          $sid = (& .venv\Scripts\fl-mcp-kernel-sid.exe).Trim()
          New-NetFirewallRule -DisplayName "FLMCP kernel: no instance metadata" -Direction Outbound -Action Block -RemoteAddress 169.254.169.254,fd00:ec2::254 -Package $sid -Profile Any | Out-Null
      - name: AppContainer tests, none skipped
        env:
          FLMCP_SANDBOX_TESTS: '1'
        shell: bash
        run: |
          set -o pipefail
          # pythonpath without src: the server under test imports the installed fl_mcp, so the
          # sitecustomize it hands the kernel's Pythons is one the container can read.
          .venv/Scripts/python.exe -m pytest -o pythonpath=tests -v -rs tests/test_kernel_appcontainer.py | tee appcontainer.log
          ! grep -E '[0-9]+ skipped' appcontainer.log
  # The one-step install surfaces (server.json, the bundle manifest, the README
  # install links) are generated from scripts/install_links.py; a stale one ships
  # a wrong version or a broken install button. The bundle is the release asset.
  install-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: scripts/build-mcpb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: fl-studio-agent-mcpb
          path: dist/fl-studio-agent.mcpb
          if-no-files-found: error
