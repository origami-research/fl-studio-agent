[project]
name = "fl-studio-agent"
version = "0.1.0"
description = "MCP server for controlling FL Studio's piano roll"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "python-rtmidi>=1.5.0",
    "watchdog>=6.0.0",
    "numpy>=2.0.0",
    "flpkit==0.8.1",
]
keywords = ["fl-studio", "mcp", "music-production", "piano-roll"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
]
authors = [{ name = "Origami Research" }]
maintainers = [{ name = "Origami Research" }]

[project.urls]
Repository = "https://github.com/origami-research/fl-studio-agent"
Documentation = "https://github.com/origami-research/fl-studio-agent/tree/main/docs"

[project.optional-dependencies]

[project.scripts]
fl-mcp = "fl_mcp.server:main"
fl-mcp-doctor = "fl_mcp.doctor:main"
fl-mcp-contract = "fl_mcp.contract:main"
fl-mcp-dev-session = "fl_mcp.dev_session:main"
fl-mcp-install = "fl_mcp.fl.install:main"
fl-mcp-control-broker = "fl_mcp.control_broker:main"
fl-mcp-template = "fl_mcp.template:main"
fl-mcp-listen = "fl_mcp.audio_stream:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Everything the runtime reads ships inside src/fl_mcp (the FL-side scripts in
# fl_scripts/, the template, profiles), so a wheel built from this tree or from
# its sdist is identical and self-contained. The one outside file is LICENSE,
# which only the sdist route (scripts/build-wheel.sh) carries into the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/fl_mcp"]
artifacts = ["src/fl_mcp/assets/session-template.flp"]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"


[dependency-groups]
dev = ["pytest>=8.0", "pyflp>=2.0", "python-rtmidi>=1.5", "flpkit==0.8.1"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Enforce the hygiene the code-quality proposal (docs/19) is built on. TRY003
# (vanilla raise messages) and PLC0415 (in-function imports) are baselined here
# and retired in proposal phases 2-3 (they need package unification first).
select = ["E", "F", "I", "BLE", "TRY", "SIM", "PTH", "TID", "RUF"]
ignore = ["TRY003", "PLC0415", "E501"]  # E402 retired: fl/ quarantine fixed the cross-tree boundary (#80)

[tool.ruff.lint.per-file-ignores]
# Tests may catch broadly / suppress deliberately. RUF059: unpacking a fixture
# tuple (`session, bridge, control = wired`) and using a subset is idiomatic.
"tests/**" = ["BLE", "TRY", "SIM105", "RUF059"]
# F811/E402: the frozen codec is embedded after its host imports.
# BLE001/TRY004/SIM115: FL's callback and cleanup boundaries cannot let host
# exceptions escape.
# PTH*: this soon-to-be-removed refuted ctl file lane must retain FL's legacy
# path APIs until its dedicated deletion lands.
"src/fl_mcp/fl_scripts/device_FLMCP.py" = [
    "BLE001", "E402", "F811", "PTH104", "PTH111", "PTH112", "PTH118", "PTH120", "PTH123", "PTH208", "SIM115", "TRY004",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: requires a deliberate live FL Studio session"]
