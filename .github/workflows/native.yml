name: native

# Builds the FL MCP Bridge for every platform FL Studio runs on, with its
# mock-host tests. Pull requests that touch native code run it; the release
# workflow calls it and publishes the two libraries (fetch_sdk.sh pulls the
# SDK headers from the public CMake-template mirror; no secret is needed and
# native/sdk stays untracked).
on:
  push:
    # Branches only: a tag push builds through release.yml, not a second time here.
    branches: [main]
    paths:
      - '.github/workflows/native.yml'
      - 'native/**'
  pull_request:
    paths:
      - '.github/workflows/native.yml'
      - 'native/**'
  workflow_call:
    inputs:
      ref:
        description: the tag or commit to build (the release workflow passes its tag)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  bridge:
    name: Build Windows Bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fetch the FL SDK into the ignored checkout directory
        shell: bash
        run: native/scripts/fetch_sdk.sh
      - name: Install MSVC Build Tools
        shell: pwsh
        run: choco install visualstudio2022buildtools --package-parameters '--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --locale en-US' --yes --no-progress
      - name: Configure MSVC build
        run: cmake -S native -B native/build-windows -G "Visual Studio 17 2022" -A x64
      - name: Build Bridge and mock-host tests
        run: cmake --build native/build-windows --config Release --target bridge bridge_core_test bridge_abi_test bridge_events_test bridge_gui_test
      - name: Run mock-host tests and Windows ABI check
        run: ctest --test-dir native/build-windows -C Release --output-on-failure
      - name: Upload Bridge DLL
        uses: actions/upload-artifact@v4
        with:
          name: FL-MCP-Bridge-Windows-x64
          path: native/build-windows/Release/FL MCP Bridge_x64.dll
          if-no-files-found: error

  bridge-macos:
    name: Build macOS Bridge
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fetch the FL SDK into the ignored checkout directory
        run: native/scripts/fetch_sdk.sh
      - name: Configure (universal arm64 + x86_64, set in native/CMakeLists.txt)
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Bridge and mock-host tests
        run: cmake --build native/build -j 4
      - name: Run mock-host tests
        run: ctest --test-dir native/build --output-on-failure
      - name: The library is universal
        run: |
          archs=$(lipo -archs "native/build/FL MCP Bridge_x64.dylib")
          echo "architectures: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "missing arm64"; exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "missing x86_64"; exit 1 ;; esac
      - name: Upload Bridge dylib
        uses: actions/upload-artifact@v4
        with:
          name: FL-MCP-Bridge-macOS-universal
          path: native/build/FL MCP Bridge_x64.dylib
          if-no-files-found: error
