[project]
name = "fl-studio-mcp"
version = "0.1.0"
description = "MCP server for controlling FL Studio's piano roll"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "python-rtmidi>=1.5.0",
    "watchdog>=6.0.0",
    "numpy>=2.0.0",
]
keywords = ["fl-studio", "mcp", "music-production", "piano-roll"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
]
authors = [{ name = "Origami Research" }]
maintainers = [{ name = "Origami Research" }]

[project.urls]
Repository = "https://github.com/origami-research/fl-studio-mcp"
Documentation = "https://github.com/origami-research/fl-studio-mcp/tree/main/docs"

[project.optional-dependencies]
# flpkit 0.8.0 is private until its independent PyPI release. uv resolves this
# extra from the pinned source below in a private checkout; it is not a public
# package dependency.
private = ["flpkit==0.8.0"]

[project.scripts]
fl-mcp = "fl_mcp.server:main"
fl-mcp-contract = "fl_mcp.contract:main"
fl-mcp-dev-session = "fl_mcp.dev_session:main"
fl-mcp-install = "fl_mcp.fl.install:main"
fl-mcp-control-broker = "fl_mcp.control_broker:main"
fl-mcp-template = "fl_mcp.template:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_mcp"]
artifacts = ["src/fl_mcp/assets/session-template.flp"]
dev-mode-dirs = ["src", "../fl-scripts/controller"]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
"../fl-scripts/controller/device_FLMCP.py" = "src/fl_mcp/_controller/device_FLMCP.py"
"../fl-scripts/controller/flmcp_codec.py" = "src/fl_mcp/_codec.py"

[tool.uv.sources]
flpkit = { git = "https://github.com/clarkipeng/flpkit", tag = "v0.8.0" }

[dependency-groups]
dev = ["pytest>=8.0", "pyflp>=2.0", "python-rtmidi>=1.5", "flpkit==0.8.0"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Enforce the hygiene the code-quality proposal (docs/19) is built on. TRY003
# (vanilla raise messages) and PLC0415 (in-function imports) are baselined here
# and retired in proposal phases 2-3 (they need package unification first).
select = ["E", "F", "I", "BLE", "TRY", "SIM", "PTH", "TID", "RUF"]
ignore = ["TRY003", "PLC0415", "E501"]  # E402 retired: fl/ quarantine fixed the cross-tree boundary (#80)

[tool.ruff.lint.per-file-ignores]
# Tests may catch broadly / suppress deliberately. RUF059: unpacking a fixture
# tuple (`session, bridge, control = wired`) and using a subset is idiomatic.
"tests/**" = ["BLE", "TRY", "SIM105", "RUF059"]
[tool.pytest.ini_options]
testpaths = ["tests", "../fl-scripts/controller/tests"]
markers = ["e2e: requires a deliberate live FL Studio session"]
