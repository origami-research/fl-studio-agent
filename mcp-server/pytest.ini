[pytest]
# `src` makes `fl_mcp` importable and `tests` holds test-only compatibility
# helpers. The private live-test harness is intentionally not on this path.
pythonpath = src tests
testpaths = tests
markers =
    e2e: live-FL end-to-end tests; require a real FL Studio and FL_E2E=1 (see tests/e2e)
