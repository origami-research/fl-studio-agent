name: release

# A version tag on the public repository is the last step of
# scripts/oss/publish-public-mirror.sh, which uploads the same version to PyPI
# first. This builds the Bridge for macOS and Windows (native.yml) and the
# Claude Desktop bundle, creates the GitHub release with them, SHA256SUMS and
# the Bridge NOTICE (fl-mcp-install downloads the Bridge from here and checks it
# against SHA256SUMS), publishes server.json to the MCP Registry, and checks
# the published package on a fresh Mac (macos-smoke). The registry namespace
# io.github.origami-research/* is granted to workflows in that account's
# repositories through GitHub OIDC, so no token is stored.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)release, e.g. v0.1.1
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  bridges:
    if: github.repository == 'origami-research/fl-studio-agent'
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    if: github.repository == 'origami-research/fl-studio-agent'
    needs: bridges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('mcp-server/pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package version $version"; exit 1; }
          test -s "docs/releases/$TAG.md" || { echo "missing release notes docs/releases/$TAG.md"; exit 1; }
      - name: Build the Claude Desktop bundle
        run: scripts/build-mcpb.sh dist
      - uses: actions/download-artifact@v4
        with:
          name: FL-MCP-Bridge-macOS-universal
          path: bridge/macos
      - uses: actions/download-artifact@v4
        with:
          name: FL-MCP-Bridge-Windows-x64
          path: bridge/windows
      - name: Name the Bridge assets and checksum them
        # Asset names are fl/bridge.py RELEASE_ASSETS; fl-mcp-install verifies against SHA256SUMS.
        run: |
          cp "bridge/macos/FL MCP Bridge_x64.dylib" dist/fl-mcp-bridge-macos-universal.dylib
          cp "bridge/windows/FL MCP Bridge_x64.dll" dist/fl-mcp-bridge-windows-x64.dll
          cp native/bridge/NOTICE.txt dist/BRIDGE-NOTICE.txt
          (cd dist && sha256sum fl-mcp-bridge-macos-universal.dylib fl-mcp-bridge-windows-x64.dll fl-studio-agent.mcpb > SHA256SUMS && cat SHA256SUMS)
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/fl-studio-agent.mcpb dist/fl-mcp-bridge-macos-universal.dylib dist/fl-mcp-bridge-windows-x64.dll dist/SHA256SUMS dist/BRIDGE-NOTICE.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --notes-file "docs/releases/$TAG.md"
          fi

  registry:
    if: github.repository == 'origami-research/fl-studio-agent'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install mcp-publisher (pinned by sha256)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: The PyPI release this entry points at exists
        run: |
          version=${TAG#v}
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/fl-studio-agent/$version/json")
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "fl-studio-agent $version is not on PyPI"; exit 1
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # The published package on a fresh Mac, as a user gets it: uvx installs it
  # from PyPI, the server answers over stdio and says confined=true, and the
  # model's tools cannot write outside their workspace (docs/38).
  macos-smoke:
    if: github.repository == 'origami-research/fl-studio-agent'
    runs-on: macos-15
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: The PyPI release exists
        run: |
          version=${TAG#v}
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/fl-studio-agent/$version/json")
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "fl-studio-agent $version is not on PyPI"; exit 1
      - name: uvx runs the released version
        run: |
          out=$(uvx --python 3.12 "fl-studio-agent@${TAG#v}" --version)
          echo "$out"
          test "$out" = "fl-studio-agent ${TAG#v}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Over stdio it is confined and refuses a write outside its workspace
        run: |
          uv run --no-project --python 3.12 --with mcp python .github/scripts/macos_smoke.py \
            uvx --python 3.12 "fl-studio-agent@${TAG#v}" --workspace-only
