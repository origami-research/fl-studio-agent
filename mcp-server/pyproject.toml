[project]
name = "fl-studio-mcp"
version = "0.1.0"
description = "MCP server for controlling FL Studio's piano roll"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0"]

[project.scripts]
fl-mcp = "fl_mcp.server:main"
fl-mcp-install = "fl_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "pyflp>=2.0"]
