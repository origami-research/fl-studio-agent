[pytest]
# `..` (the repo root) makes `harness` importable, so source modules and tests
# reach it without their own sys.path.insert (docs/19 root cause 2). `src` makes
# `fl_mcp` importable.
pythonpath = src tests ..
testpaths = tests ../fl-scripts/controller/tests
markers =
    e2e: live-FL end-to-end tests; require a real FL Studio and FL_E2E=1 (see tests/e2e)
