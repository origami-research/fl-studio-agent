[project]
name = "fl-mcp-repo"
version = "0.1.0"
description = "Repo-level package: the FL test/ops harness"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed editable (`uv pip install -e .` from the repo root) alongside the
# mcp-server package. This is the declared replacement for the per-module
# sys.path.insert hacks (docs/19 root cause 2): `harness` becomes an ordinary
# importable package in any venv that installs the repo. The controller wire
# codec ships inside fl-studio-agent as `fl_mcp.fl_scripts.flmcp_codec`.
[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "TRY", "SIM", "PTH", "TID", "RUF"]
ignore = ["TRY003", "PLC0415", "E501"]

[tool.ruff.lint.per-file-ignores]
# These live experiments preserve their primary failure after restoring FL,
# and report best-effort probes rather than treating them as test assertions.
"experiments/e3_playlist_write.py" = ["BLE001", "RUF059", "TRY300"]
# This standalone harness deliberately sets its import path before imports.
"harness/doctor.py" = ["E402"]
