name: native-windows

on:
  push:
    paths:
      - '.github/workflows/native-windows.yml'
      - 'native/**'
  pull_request:
    paths:
      - '.github/workflows/native-windows.yml'
      - 'native/**'

permissions:
  contents: read

jobs:
  bridge:
    name: Build Windows Bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # fetch_sdk.sh uses the public CMake-template mirror. No repository secret
      # is required, and native/sdk remains untracked.
      - name: Fetch proprietary SDK into ignored checkout directory
        shell: bash
        run: native/scripts/fetch_sdk.sh
      - name: Install MSVC Build Tools
        shell: pwsh
        run: choco install visualstudio2022buildtools --package-parameters '--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --locale en-US' --yes --no-progress
      - name: Configure MSVC build
        run: cmake -S native -B native/build-windows -G "Visual Studio 17 2022" -A x64
      - name: Build Bridge and mock-host tests
        run: cmake --build native/build-windows --config Release --target bridge bridge_core_test bridge_abi_test bridge_events_test bridge_gui_test
      - name: Run mock-host tests and Windows ABI check
        run: ctest --test-dir native/build-windows -C Release --output-on-failure
      - name: Upload Bridge DLL
        uses: actions/upload-artifact@v4
        with:
          name: FL-MCP-Bridge-Windows-x64
          path: native/build-windows/Release/FL MCP Bridge_x64.dll
          if-no-files-found: error
